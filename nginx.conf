# mTLS reverse proxy for Hono backend
# Usage: nginx -c $(pwd)/nginx.conf
# For production, install system-wide and use systemd

upstream hono_backend {
    server localhost:80;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.awanipro.com;
    return 301 https://$server_name$request_uri;
}

# mTLS server
server {
    listen 443 ssl http2;
    server_name api.awanipro.com;

    # Server certificate and key
    ssl_certificate /etc/nginx/certs/server-cert.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;

    # Client certificate validation
    ssl_client_certificate /etc/nginx/certs/ca-cert.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;

    # TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        # Reject requests without valid client certificate
        if ($ssl_client_verify != SUCCESS) {
            return 403 "Client certificate verification failed";
        }

        proxy_pass http://hono_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass client cert info to backend (optional, for logging/debugging)
        proxy_set_header X-SSL-Client-Cert $ssl_client_cert;
    }
}
